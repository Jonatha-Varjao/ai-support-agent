[project]
name = "ai-support-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "sqlalchemy>=2",
]

[tool.uv.workspace]
members = ["apps/api", "services/mcp"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
